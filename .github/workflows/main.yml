name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixar código do repositório
      uses: actions/checkout@v3

    - name: 2. Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: 3. Instalar Poetry e Plugin de Exportação
      run: |
        pip install poetry poetry-plugin-export

    - name: 4. Gerar requirements.txt para o Docker
      run: |
        poetry export -f requirements.txt --output requirements.txt

    - name: 5. Build da Imagem Docker
      run: |
        docker build -t bookstore-test .