version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=bookstore_db
      - POSTGRES_USER=usuario
      - POSTGRES_PASSWORD=senha_forte
    networks:
      - bookstore_network

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=bookstore_db
      - DB_USER=usuario
      - DB_PASSWORD=senha_forte
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    networks:
      - bookstore_network

networks:
  bookstore_network:
    driver: bridge

volumes:
  postgres_data: